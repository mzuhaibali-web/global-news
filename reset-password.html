
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Global News</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="auth-container">
    <h1>Reset Your Password</h1>
    <p>Enter your new password below.</p>

    <form id="resetForm">
      <label for="password">New Password</label>
      <input
        type="password"
        id="password"
        minlength="8"
        placeholder="Enter new password"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        minlength="8"
        placeholder="Confirm new password"
        required
      >

      <button type="submit" id="resetBtn">Update Password</button>
      <p id="message" role="status"></p>
    </form>

    <p><a href="login.html">Back to Login</a></p>
  </main>

  <script>
    const SUPABASE_URL = "https://dcliuifevgyynbdmtjhk.supabase.co";

    // Yahan apni Supabase publishable/anon key lagani hai.
    // Secret ya service_role key kabhi use mat karna.
    const SUPABASE_KEY =
    "sb_publishable_vqUJWs3PUS7Qj4vYuleyFg_0c9DgsI_";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const resetForm = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "Password kam az kam 8 characters ka hona chahiye.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Dono passwords match nahi karte.";
        return;
      }

      resetBtn.disabled = true;
      message.textContent = "Password update ho raha hai...";

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        message.textContent =
          "Password successfully update ho gaya! Ab login page par jao.";

        resetForm.reset();
      } catch (error) {
        message.textContent =
          "Error: " + error.message +
          ". Recovery link expire ho gaya ho to naya link lena hoga.";
      } finally {
        resetBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
