  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Global News</title>
  <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="professional-theme.css">
    <link rel="stylesheet" href="luxury-effects.css">
    <link rel="stylesheet" href="luxury-components.css">
    <link rel="stylesheet" href="cosmic-aurora.css">
</head>
<body>

  <div class="auth-container">
    <h1>Forgot Password</h1>
    <p>Enter your email to receive a password reset link.</p>

    <form id="forgotForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" required
             placeholder="Enter your registered email">
      <button type="submit" id="submitBtn">Send Reset Link</button>
    </form>

    <p id="message"></p>

    <a href="login.html">Back to Login</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://dcliuifevgyynbdmtjhk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vqUJWs3PUS7Qj4vYuleyFg_0c9DgsI_";


    const supabaseClient = window.supabase.createClient(
      supabaseUrl,
      SUPABASE_KEY
    );

    document.getElementById("forgotForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message");
      const button = document.getElementById("submitBtn");

      button.disabled = true;
      message.textContent = "Please wait...";

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: "https://mzuhaibali-web.github.io/global-news/reset-password.html"
      });

      if (error) {
        message.textContent = error.message;
      } else {
        message.textContent = "If the email is registered, a reset link will be sent. Check your inbox and spam folder.";
      }

      button.disabled = false;
    });
  </script>

</body>
</html>
