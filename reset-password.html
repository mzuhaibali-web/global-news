<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Global News</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="professional-theme.css">
    <link rel="stylesheet" href="luxury-effects.css">
    <link rel="stylesheet" href="luxury-components.css">
</head>
<body>
  <main class="auth-container">
    <h1>Reset Your Password</h1>
    <p>Enter your new password below.</p>

    <form id="resetForm">
      <label for="password">New Password</label>
      <input type="password" id="password" minlength="8"
        placeholder="Enter new password" required>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" minlength="8"
        placeholder="Confirm new password" required>

      <button type="submit" id="resetBtn" disabled>Update Password</button>
      <p id="message" role="status" aria-live="polite">Checking recovery link...</p>
    </form>

    <p><a href="login.html">Back to Login</a></p>
  </main>

  <script>
    const SUPABASE_URL = "https://dcliuifevgyynbdmtjhk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vqUJWs3PUS7Qj4vYuleyFg_0c9DgsI_";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const resetForm = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");

    let recoveryReady = false;

    async function checkRecoverySession() {
      try {
        const hashParams = new URLSearchParams(
          window.location.hash.startsWith("#")
            ? window.location.hash.slice(1)
            : window.location.hash
        );
        const queryParams = new URLSearchParams(window.location.search);

        const tokenHash = queryParams.get("token_hash");
        const type = queryParams.get("type") || hashParams.get("type");
        const accessToken = hashParams.get("access_token");
        const refreshToken = hashParams.get("refresh_token");

        if (tokenHash && type === "recovery") {
          const { error } = await supabaseClient.auth.verifyOtp({
            token_hash: tokenHash,
            type: "recovery"
          });
          if (error) throw error;
        } else if (accessToken && refreshToken && type === "recovery") {
          const { error } = await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) throw error;
        }

        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;

        if (data.session) {
          recoveryReady = true;
          resetBtn.disabled = false;
          message.textContent =
            "Recovery session ready. Enter your new password.";
        } else {
          message.textContent =
            "Valid recovery session nahi mila. Gmail ke valid recovery link se yahan aayen.";
        }
      } catch (error) {
        message.textContent = "Recovery link verify nahi hua: " + error.message;
      }
    }

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!recoveryReady) {
        message.textContent = "Pehle valid recovery link open karein.";
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent =
          "Password kam az kam 8 characters ka hona chahiye.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Dono passwords match nahi karte.";
        return;
      }

      resetBtn.disabled = true;
      message.textContent = "Password update ho raha hai...";

      try {
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) throw error;

        message.textContent =
          "Password successfully update ho gaya! Ab login page par jao.";
        resetForm.reset();
        recoveryReady = false;
      } catch (error) {
        message.textContent = "Error: " + error.message;
      } finally {
        resetBtn.disabled = !recoveryReady;
      }
    });

    checkRecoverySession();
  </script>
</body>
</html>
