
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Global News</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="auth-container">
    <h1>Login to Global News</h1>
    <p>Welcome back! Please log in to continue.</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginBtn">Login</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p><a href="forgot-password.html">Forgot Password?</a></p>
    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    <p><a href="index.html">Back to Home</a></p>
  </main>

  <script>
    const SUPABASE_URL = "https://dcliuifevgyynbdmtjhk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vqUJWs3PUS7Qj4vYuleyFg_0c9DgsI_";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginBtn.disabled = true;
      message.textContent = "Logging in...";

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        message.textContent = "Login successful! Opening homepage...";

        window.location.href = "index.html";
      } catch (error) {
        message.textContent = "Login failed: " + error.message;
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
